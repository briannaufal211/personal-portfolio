name: Refresh HD project thumbnails
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HD SVG thumbnails and update project cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = Path('assets/project-thumbnails/hd')
          out.mkdir(parents=True, exist_ok=True)

          projects = [
            ('hotel-booking-cancellation.svg','HOTEL BOOKING CANCELLATION PREDICTION','MACHINE LEARNING','Risk scoring • classification','hotel'),
            ('telemarketing-term-deposit.svg','TERM DEPOSIT SUBSCRIPTION PREDICTION','MACHINE LEARNING','Campaign targeting • classification','tele'),
            ('airbnb-bangkok-analysis.svg','AIRBNB BANGKOK • LISTING & PRICING ANALYSIS','DATA ANALYSIS','Pricing patterns • market segmentation','airbnb'),
            ('indonesia-ev-market.svg','INDONESIA EV MARKET & VALUE ANALYSIS','DATA ANALYSIS','Price • range • market positioning','ev'),
            ('streaming-platform-analytics.svg','STREAMING PLATFORM ANALYTICS','DATA ANALYSIS','Engagement • content • regional trends','stream'),
            ('omdb-movie-analytics.svg','MOVIE ANALYTICS DASHBOARD','DATA ANALYSIS','Ratings • revenue • genre trends','movie'),
            ('olx-used-cars-analysis.svg','OLX USED CARS • MARKET PRICE ANALYSIS','DATA ANALYSIS','Price drivers • listing patterns','olx'),
            ('inventory-management.svg','INVENTORY MANAGEMENT SYSTEM','DATA ENGINEERING','CRUD • traceability • operations','crud'),
          ]

          def visual(kind):
            if kind=='hotel':
              return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">Cancellation risk</text><text x="940" y="365" fill="#f5f7f9" font-size="53" font-weight="700" font-family="Arial">78.4%</text><text x="940" y="398" fill="#63e6c2" font-size="18" font-family="Arial">model recall / decision support</text><rect x="940" y="445" width="430" height="18" rx="9" fill="#263444"/><rect x="940" y="445" width="337" height="18" rx="9" fill="#63e6c2"/><circle cx="1040" cy="550" r="54" fill="#17212c" stroke="#63e6c2" stroke-width="10"/><text x="1040" y="559" text-anchor="middle" fill="#f5f7f9" font-size="25" font-weight="700" font-family="Arial">ML</text><rect x="1140" y="500" width="64" height="95" rx="10" fill="#24303d"/><rect x="1225" y="465" width="64" height="130" rx="10" fill="#24303d"/><rect x="1310" y="430" width="64" height="165" rx="10" fill="#24303d"/>'''
            if kind=='tele':
              return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">Subscription propensity</text><polyline points="940,555 1005,515 1070,535 1135,465 1200,485 1265,420 1330,445 1380,365" fill="none" stroke="#63e6c2" stroke-width="8"/><circle cx="1380" cy="365" r="10" fill="#63e6c2"/><rect x="940" y="345" width="155" height="76" rx="16" fill="#1a2531"/><text x="960" y="377" fill="#91a0b0" font-size="15" font-family="Arial">Precision</text><text x="960" y="407" fill="#f5f7f9" font-size="28" font-weight="700" font-family="Arial">0.69</text><rect x="1115" y="345" width="170" height="76" rx="16" fill="#1a2531"/><text x="1135" y="377" fill="#91a0b0" font-size="15" font-family="Arial">Campaign lift</text><text x="1135" y="407" fill="#f5f7f9" font-size="28" font-weight="700" font-family="Arial">+12%</text>'''
            if kind=='airbnb':
              return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">Nightly price distribution</text><line x1="940" y1="575" x2="1380" y2="575" stroke="#334353"/><rect x="965" y="510" width="44" height="65" rx="6" fill="#63e6c2"/><rect x="1025" y="465" width="44" height="110" rx="6" fill="#63e6c2"/><rect x="1085" y="420" width="44" height="155" rx="6" fill="#63e6c2"/><rect x="1145" y="395" width="44" height="180" rx="6" fill="#63e6c2"/><rect x="1205" y="430" width="44" height="145" rx="6" fill="#4dcbb0"/><rect x="1265" y="475" width="44" height="100" rx="6" fill="#4dcbb0"/><rect x="1325" y="515" width="44" height="60" rx="6" fill="#4dcbb0"/><circle cx="1290" cy="350" r="42" fill="#192431" stroke="#ff8a6d" stroke-width="8"/><text x="1290" y="360" text-anchor="middle" fill="#ffb09c" font-size="22" font-weight="700" font-family="Arial">฿</text>'''
            if kind=='ev':
              return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">EV market snapshot</text><rect x="940" y="350" width="125" height="78" rx="16" fill="#1a2531"/><text x="960" y="380" fill="#91a0b0" font-size="14" font-family="Arial">Models</text><text x="960" y="408" fill="#f5f7f9" font-size="27" font-weight="700" font-family="Arial">52</text><rect x="1080" y="350" width="135" height="78" rx="16" fill="#1a2531"/><text x="1100" y="380" fill="#91a0b0" font-size="14" font-family="Arial">Avg. range</text><text x="1100" y="408" fill="#f5f7f9" font-size="27" font-weight="700" font-family="Arial">326 km</text><rect x="1230" y="350" width="150" height="78" rx="16" fill="#1a2531"/><text x="1250" y="380" fill="#91a0b0" font-size="14" font-family="Arial">Value score</text><text x="1250" y="408" fill="#63e6c2" font-size="27" font-weight="700" font-family="Arial">+12.5%</text><polyline points="945,565 1010,525 1075,540 1140,485 1205,500 1270,440 1335,455 1380,390" fill="none" stroke="#63e6c2" stroke-width="8"/>'''
            if kind=='stream':
              return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">Engagement overview</text><circle cx="1060" cy="470" r="90" fill="none" stroke="#263444" stroke-width="28"/><circle cx="1060" cy="470" r="90" fill="none" stroke="#63e6c2" stroke-width="28" stroke-dasharray="350 220" transform="rotate(-90 1060 470)"/><text x="1060" y="463" text-anchor="middle" fill="#f5f7f9" font-size="30" font-weight="700" font-family="Arial">1.2M</text><text x="1060" y="493" text-anchor="middle" fill="#91a0b0" font-size="16" font-family="Arial">users</text><rect x="1200" y="365" width="170" height="66" rx="15" fill="#1a2531"/><text x="1220" y="393" fill="#91a0b0" font-size="14" font-family="Arial">Watch hours</text><text x="1220" y="418" fill="#f5f7f9" font-size="22" font-weight="700" font-family="Arial">8.4M</text><rect x="1200" y="450" width="170" height="66" rx="15" fill="#1a2531"/><text x="1220" y="478" fill="#91a0b0" font-size="14" font-family="Arial">Avg. session</text><text x="1220" y="503" fill="#f5f7f9" font-size="22" font-weight="700" font-family="Arial">92 min</text>'''
            if kind=='movie':
              return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">Movie performance</text><line x1="940" y1="575" x2="1380" y2="575" stroke="#334353"/><rect x="965" y="500" width="54" height="75" rx="7" fill="#ff8a6d"/><rect x="1040" y="450" width="54" height="125" rx="7" fill="#63e6c2"/><rect x="1115" y="415" width="54" height="160" rx="7" fill="#63e6c2"/><rect x="1190" y="470" width="54" height="105" rx="7" fill="#ff8a6d"/><rect x="1265" y="385" width="54" height="190" rx="7" fill="#63e6c2"/><text x="1380" y="615" text-anchor="end" fill="#637286" font-size="15" font-family="Arial">rating • revenue • genre</text>'''
            if kind=='olx':
              return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">Used-car price drivers</text><line x1="940" y1="565" x2="1370" y2="360" stroke="#334353" stroke-width="3"/><g fill="#63e6c2"><circle cx="970" cy="535" r="8"/><circle cx="1015" cy="515" r="8"/><circle cx="1060" cy="522" r="8"/><circle cx="1105" cy="485" r="8"/><circle cx="1150" cy="460" r="8"/><circle cx="1195" cy="475" r="8"/><circle cx="1240" cy="425" r="8"/><circle cx="1285" cy="435" r="8"/><circle cx="1330" cy="395" r="8"/></g><g fill="#ff8a6d"><circle cx="1080" cy="495" r="8"/><circle cx="1210" cy="450" r="8"/><circle cx="1345" cy="380" r="8"/></g><rect x="1110" y="335" width="245" height="65" rx="15" fill="#1a2531"/><text x="1132" y="363" fill="#91a0b0" font-size="14" font-family="Arial">Market price spread</text><text x="1132" y="388" fill="#f5f7f9" font-size="22" font-weight="700" font-family="Arial">Segmented</text>'''
            return '''<rect x="900" y="255" width="520" height="390" rx="26" fill="#111a24" stroke="#263444"/><text x="940" y="305" fill="#91a0b0" font-size="21" font-family="Arial">Inventory operations</text><rect x="940" y="360" width="430" height="52" rx="14" fill="#1a2531"/><rect x="940" y="430" width="430" height="52" rx="14" fill="#1a2531"/><rect x="940" y="500" width="430" height="52" rx="14" fill="#1a2531"/><circle cx="970" cy="386" r="9" fill="#63e6c2"/><circle cx="970" cy="456" r="9" fill="#63e6c2"/><circle cx="970" cy="526" r="9" fill="#ff8a6d"/><text x="1000" y="393" fill="#f5f7f9" font-size="17" font-family="Arial">Stock updated</text><text x="1240" y="393" fill="#63e6c2" font-size="16" font-weight="700" font-family="Arial">OK</text><text x="1000" y="463" fill="#f5f7f9" font-size="17" font-family="Arial">Traceability</text><text x="1205" y="463" fill="#63e6c2" font-size="16" font-weight="700" font-family="Arial">READY</text><text x="1000" y="533" fill="#f5f7f9" font-size="17" font-family="Arial">CRUD actions</text><text x="1205" y="533" fill="#ff8a6d" font-size="16" font-weight="700" font-family="Arial">LIVE</text>'''

          def make_svg(title, badge, sub, kind):
            return f'''<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d14"/><stop offset="1" stop-color="#122033"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1490" cy="100" r="230" fill="#63e6c2" opacity=".05"/><circle cx="120" cy="810" r="240" fill="#ff8a6d" opacity=".035"/><rect x="60" y="60" width="1480" height="780" rx="40" fill="#0c141e" stroke="#273646"/><text x="120" y="145" fill="#63e6c2" font-size="22" font-weight="700" letter-spacing="3" font-family="Arial">{badge}</text><text x="120" y="220" fill="#f4f6f8" font-size="48" font-weight="700" font-family="Arial">{title}</text><text x="120" y="275" fill="#91a0b0" font-size="23" font-family="Arial">{sub}</text><rect x="120" y="330" width="610" height="2" fill="#273646"/><rect x="120" y="375" width="610" height="150" rx="24" fill="#111a24" stroke="#263444"/><text x="155" y="420" fill="#76879a" font-size="16" font-weight="700" letter-spacing="2" font-family="Arial">PORTFOLIO CASE STUDY</text><text x="155" y="466" fill="#f4f6f8" font-size="27" font-weight="700" font-family="Arial">Data → insight → decision support</text><text x="155" y="503" fill="#91a0b0" font-size="18" font-family="Arial">Clear storytelling built for recruiters and hiring teams.</text><rect x="120" y="585" width="180" height="44" rx="22" fill="#10332d" stroke="#2f7667"/><text x="210" y="613" text-anchor="middle" fill="#63e6c2" font-size="16" font-weight="700" font-family="Arial">1600 × 900 HD</text>{visual(kind)}<text x="120" y="765" fill="#5f7082" font-size="16" letter-spacing="1" font-family="Arial">BRIAN NAUFAL • DATA ANALYST / MACHINE LEARNING</text></svg>'''

          for filename,title,badge,sub,kind in projects:
            (out/filename).write_text(make_svg(title,badge,sub,kind), encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          replacements = {
            'Hotel Booking Cancellation Prediction':'hotel-booking-cancellation.svg',
            'Optimizing Telemarketing for Term Deposit Subscriptions':'telemarketing-term-deposit.svg',
            'Airbnb Bangkok':'airbnb-bangkok-analysis.svg',
            'Indonesia EV Market & Value Analysis':'indonesia-ev-market.svg',
            'Streaming Platform Analytics':'streaming-platform-analytics.svg',
            'Movie Analytics Dashboard':'omdb-movie-analytics.svg',
            'OLX Used Cars':'olx-used-cars-analysis.svg',
            'CRUD Inventory Management System':'inventory-management.svg',
          }
          blocks = list(re.finditer(r'<!--\s*P\d+:.*?(?=<!--\s*P\d+:|<!--\s*EXPERIENCE\s*-->|<!--\s*EDUCATION\s*-->|<!--\s*CONTACT\s*-->)', index, re.I|re.S))
          changed = 0
          for m in reversed(blocks):
            block = m.group(0)
            chosen = None
            for name, asset in replacements.items():
              if name.lower() in block.lower():
                chosen = asset
                break
            if not chosen:
              continue
            newblock = re.sub(r'(<img\b[^>]*?\bsrc\s*=\s*["\'])[^"\']+(\1?)', lambda x: x.group(0), block)
            newblock = re.sub(r'(<img\b[^>]*?\bsrc\s*=\s*["\'])[^"\']+(["\'])', rf'\g<1>assets/project-thumbnails/hd/{chosen}\2', block, count=1, flags=re.I|re.S)
            # featured card: keep the image visually balanced instead of stretching across the whole card
            if 'project-featured' in newblock or 'featured' in newblock:
              newblock = newblock
            index = index[:m.start()] + newblock + index[m.end():]
            changed += 1

          css = '''\n<style id="hd-thumbnail-refinement">\n/* HD project thumbnail refinement */\n#projects .project-thumb { width:100%; aspect-ratio:16/9; object-fit:cover; image-rendering:auto; background:#0e151f; }\n#projects .project-card.project-featured { display:grid; grid-template-columns:minmax(0,1.18fr) minmax(360px,.82fr); }\n#projects .project-card.project-featured .project-thumb { height:100%; aspect-ratio:auto; min-height:360px; }\n#projects .project-card.project-featured .project-body { justify-content:center; }\n@media (max-width:900px){ #projects .project-card.project-featured { display:flex; } #projects .project-card.project-featured .project-thumb { height:auto; aspect-ratio:16/9; min-height:0; } }\n</style>\n'''
          if 'id="hd-thumbnail-refinement"' not in index:
            index = index.replace('</head>', css + '</head>', 1)
          Path('index.html').write_text(index, encoding='utf-8')
          print(f'updated {changed} project cards')
          PY

      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/project-thumbnails/hd
          git commit -m "add consistent HD project thumbnails" || exit 0
          git push
          rm -f .github/workflows/refresh-hd-thumbnails.yml
          git add .github/workflows/refresh-hd-thumbnails.yml
          git commit -m "remove one-shot thumbnail workflow" || true
          git push || true
