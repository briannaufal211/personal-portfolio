name: Export Full Repository

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create repository ZIP
        run: |
          zip -qr Brian_Naufal_personal-portfolio-main.zip . -x ".git/*"

      - name: Upload repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Brian_Naufal_personal-portfolio-main
          path: Brian_Naufal_personal-portfolio-main.zip
          if-no-files-found: error
