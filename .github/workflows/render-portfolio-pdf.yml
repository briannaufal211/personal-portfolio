name: Render Portfolio PDF

on:
  push:
    paths:
      - ".github/workflows/render-portfolio-pdf.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render PDF
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const { spawn } = require('child_process');
          const fs = require('fs');

          (async () => {
            const server = spawn('python3', ['-m', 'http.server', '8000', '--bind', '127.0.0.1'], {
              stdio: 'ignore'
            });

            await new Promise(r => setTimeout(r, 1500));

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1
            });

            await page.goto('http://127.0.0.1:8000/', {
              waitUntil: 'networkidle',
              timeout: 120000
            });

            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(2500);
            await page.emulateMedia({ media: 'screen' });

            await page.pdf({
              path: 'Brian_Naufal_Portfolio_Exact.pdf',
              width: '1440px',
              height: '900px',
              printBackground: true,
              preferCSSPageSize: false,
              margin: { top: '0', right: '0', bottom: '0', left: '0' },
              displayHeaderFooter: false
            });

            await browser.close();
            server.kill();
            console.log('PDF created:', fs.statSync('Brian_Naufal_Portfolio_Exact.pdf').size, 'bytes');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: brian-naufal-portfolio-exact-pdf
          path: Brian_Naufal_Portfolio_Exact.pdf
          if-no-files-found: error
