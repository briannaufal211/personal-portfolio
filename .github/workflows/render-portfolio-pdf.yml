name: Render Portfolio PDF

on:
  push:
    paths:
      - ".github/workflows/render-portfolio-pdf.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and PDF tooling
        run: |
          npm init -y
          npm install playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium

      - name: Capture website viewport pages and build PDF
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const { PDFDocument } = require('pdf-lib');
          const { spawn } = require('child_process');
          const fs = require('fs');

          (async () => {
            const server = spawn('python3', ['-m', 'http.server', '8000', '--bind', '127.0.0.1'], {
              stdio: 'ignore'
            });

            await new Promise(r => setTimeout(r, 1500));

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1
            });

            await page.goto('http://127.0.0.1:8000/', {
              waitUntil: 'networkidle',
              timeout: 120000
            });

            await page.evaluate(() => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';
            });

            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(2500);

            const totalHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            const viewportHeight = 900;
            const width = 1440;
            const maxScroll = Math.max(0, totalHeight - viewportHeight);

            const positions = [];
            for (let y = 0; y <= maxScroll; y += viewportHeight) {
              positions.push(y);
            }
            if (positions.length === 0 || positions[positions.length - 1] !== maxScroll) {
              positions.push(maxScroll);
            }

            const pdf = await PDFDocument.create();

            for (let i = 0; i < positions.length; i++) {
              const y = positions[i];

              await page.evaluate((scrollY) => {
                window.scrollTo(0, scrollY);
              }, y);

              await page.waitForTimeout(120);

              const pngPath = `viewport-${String(i + 1).padStart(2, '0')}.png`;
              await page.screenshot({
                path: pngPath,
                fullPage: false,
                animations: 'disabled'
              });

              const pagePdf = pdf.addPage([width, viewportHeight]);
              const png = await pdf.embedPng(fs.readFileSync(pngPath));
              pagePdf.drawImage(png, { x: 0, y: 0, width, height: viewportHeight });
            }

            const bytes = await pdf.save();
            fs.writeFileSync('Brian_Naufal_Portfolio_Exact.pdf', bytes);

            await browser.close();
            server.kill();

            console.log('Total page height:', totalHeight);
            console.log('PDF pages:', positions.length);
            console.log('PDF size:', bytes.length, 'bytes');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: brian-naufal-portfolio-exact-pdf
          path: Brian_Naufal_Portfolio_Exact.pdf
          if-no-files-found: error
