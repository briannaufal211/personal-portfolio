name: Refine portfolio project layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-project-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reorder and restyle projects
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          # Work only inside the Projects section so unrelated cards are untouched.
          projects_start = html.find('<!-- PROJECTS -->')
          if projects_start == -1:
              raise SystemExit('Projects section marker not found')
          projects_end = html.find('<!-- EXPERIENCE -->', projects_start)
          if projects_end == -1:
              projects_end = html.find('<!-- EDUCATION -->', projects_start)
          if projects_end == -1:
              projects_end = html.find('<!-- CONTACT -->', projects_start)
          if projects_end == -1:
              raise SystemExit('Projects section end marker not found')

          section = html[projects_start:projects_end]

          priority = [
              ('Hotel Booking', 1),
              ('Optimizing Telemarketing', 2),
              ('Airbnb Bangkok', 3),
              ('Indonesia EV', 4),
              ('Streaming Platform', 5),
          ]

          # Each project is delimited by its P# marker. Add stable layout classes
          # based on the visible project title, preserving all existing content.
          matches = list(re.finditer(r'(?m)^<!-- P\d+:.*$', section))
          if not matches:
              raise SystemExit('Project markers not found')

          blocks = []
          for i, m in enumerate(matches):
              start = m.start()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(section)
              blocks.append(section[start:end])

          new_blocks = []
          for block in blocks:
              title_match = re.search(r'<h3[^>]*class="project-title"[^>]*>(.*?)</h3>', block, re.S)
              title = re.sub(r'<[^>]+>', '', title_match.group(1)).strip() if title_match else ''

              order = 100
              is_featured = False
              for keyword, rank in priority:
                  if keyword.lower() in title.lower():
                      order = rank
                      is_featured = rank == 1
                      break

              def patch_opening(m):
                  classes = m.group(1).split()
                  classes = [c for c in classes if c != 'featured' and not c.startswith('project-order-')]
                  classes.append(f'project-order-{order}')
                  if is_featured:
                      classes.append('project-featured')
                  return '<div class="' + ' '.join(classes) + '"'

              block = re.sub(r'<div class="([^"]*\bproject-card\b[^"]*)"', patch_opening, block, count=1)
              new_blocks.append(block)

          section = section[:matches[0].start()] + ''.join(new_blocks)
          html = html[:projects_start] + section + html[projects_end:]

          css = r'''
          /* Portfolio project layout refinement */
          #projects > .container {
            width: min(calc(100% - 48px), 1240px);
            max-width: 1240px;
          }

          #projects .projects-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            align-items: stretch;
          }

          #projects .projects-grid .project-card {
            order: 100;
          }

          #projects .projects-grid .project-card.project-order-1 {
            order: 1;
          }
          #projects .projects-grid .project-card.project-order-2 {
            order: 2;
          }
          #projects .projects-grid .project-card.project-order-3 {
            order: 3;
          }
          #projects .projects-grid .project-card.project-order-4 {
            order: 4;
          }
          #projects .projects-grid .project-card.project-order-5 {
            order: 5;
          }

          #projects .projects-grid .project-card.project-featured {
            grid-column: 1 / -1;
          }

          @media (max-width: 900px) {
            #projects .projects-grid {
              grid-template-columns: 1fr;
            }
            #projects .projects-grid .project-card.project-featured {
              grid-column: auto;
            }
          }

          @media (max-width: 580px) {
            #projects > .container {
              width: min(calc(100% - 32px), 1240px);
            }
          }
          '''

          marker = '</head>'
          if '/* Portfolio project layout refinement */' not in html:
              pos = html.lower().find(marker)
              if pos == -1:
                  raise SystemExit('</head> marker not found')
              html = html[:pos] + '<style>\n' + css + '\n</style>\n' + html[pos:]

          path.write_text(html, encoding='utf-8')
      - name: Commit refined layout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'refine project layout and highlight ML work'
            git push
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm -f .github/workflows/refine-project-layout.yml
          git commit -m 'remove one-shot layout workflow'
          git push
