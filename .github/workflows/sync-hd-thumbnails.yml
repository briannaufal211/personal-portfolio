name: Sync portfolio thumbnails
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio thumbnail paths and layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'assets/project-thumbnails/hd/hotel-booking-cancellation.svg': 'assets/project-thumbnails/01_Hotel_Booking_Cancellation_Prediction.png',
              'assets/project-thumbnails/hd/telemarketing-term-deposit.svg': 'assets/project-thumbnails/02_Telemarketing_Term_Deposit_Optimization.png',
              'assets/project-thumbnails/hd/airbnb-bangkok-analysis.svg': 'assets/project-thumbnails/03_Airbnb_Bangkok_Pricing_Analysis.png',
              'assets/project-thumbnails/ev-market-value-thumbnail.png': 'assets/project-thumbnails/04_Indonesia_EV_Market_Value_Analysis.png',
              'assets/project-thumbnails/hd/streaming-platform-analytics.svg': 'assets/project-thumbnails/05_Streaming_Platform_Analytics_Dashboard.png',
              'assets/project-thumbnails/hd/omdb-movie-analytics.svg': 'assets/project-thumbnails/06_Movie_Analytics_Dashboard.png',
              'assets/project-thumbnails/hd/olx-used-cars-analysis.svg': 'assets/project-thumbnails/07_OLX_Used_Cars_Market_Price_Analysis.png',
              'assets/project-thumbnails/hd/inventory-management.svg': 'assets/project-thumbnails/08_CRUD_Inventory_Management_System.png',
              'assets/project-thumbnails/omdb-movie-analytics-thumbnail.png': 'assets/project-thumbnails/06_Movie_Analytics_Dashboard.png',
              'assets/project-thumbnails/streaming-platform-thumbnail.png': 'assets/project-thumbnails/05_Streaming_Platform_Analytics_Dashboard.png',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          text = text.replace('https://github.com/briannaufal211" target="_blank">GitHub', 'https://github.com/briannaufal211/imdb-movie-analytics-dashboard" target="_blank">GitHub', 1)
          # Consistent thumbnail presentation: every card uses one column in the responsive grid.
          text = text.replace('.project-card.featured { grid-column: span 2; }', '.project-card.featured { grid-column: span 1; }')
          text = text.replace('.project-card.featured{grid-column:span 2}', '.project-card.featured{grid-column:span 1}')
          if '.project-thumb {' in text:
              import re
              text = re.sub(r'\.project-thumb \{[^}]*\}', '.project-thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: center; display: block; background: var(--bg3); }', text, count=1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "use uploaded project thumbnails"
          git push
