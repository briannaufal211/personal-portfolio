<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050607"/>
    <stop offset="1" stop-color="#121417"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="720" y="80" fill="#212326" font-size="150" font-weight="800" font-family="Arial" letter-spacing="-6">SALES</text>
<text x="40" y="860" fill="#1b1d20" font-size="110" font-weight="800" font-family="Arial">ANALYTICS</text>

<!-- Adidas mark + title block -->
<g transform="translate(70,105)">
  <polygon points="0,215 52,215 105,285 53,285" fill="#f4f4f1"/>
  <polygon points="62,170 117,170 185,285 130,285" fill="#f4f4f1"/>
  <polygon points="128,118 184,118 255,285 198,285" fill="#f4f4f1"/>
  <text x="5" y="375" fill="#f4f4f1" font-size="72" font-weight="700" font-family="Arial" letter-spacing="-3">adidas</text>
  <text x="5" y="450" fill="#f4f4f1" font-size="40" font-weight="700" font-family="Arial">Sales Performance &amp;</text>
  <text x="5" y="494" fill="#f4f4f1" font-size="40" font-weight="700" font-family="Arial">Revenue Optimization</text>
  <text x="5" y="555" fill="#aeb1b4" font-size="16" font-weight="700" font-family="Arial" letter-spacing="3">SQL-BASED SALES &amp; COMMERCIAL</text>
  <text x="5" y="582" fill="#aeb1b4" font-size="16" font-weight="700" font-family="Arial" letter-spacing="3">ANALYTICS CASE STUDY</text>
  <text x="5" y="645" fill="#777b7e" font-size="13" font-family="Arial" letter-spacing="2">MYSQL 8.0  •  SQL  •  WINDOW FUNCTIONS  •  CTE</text>
  <text x="5" y="720" fill="#f4f4f1" font-size="18" font-weight="700" font-family="Arial" letter-spacing="4">ANALYZE  /  INSIGHTS  /  OPTIMIZE</text>
</g>

<!-- torn paper panels -->
<g filter="url(#shadow)">
  <rect x="610" y="75" width="820" height="210" rx="8" fill="#efeee8"/>
  <rect x="570" y="305" width="530" height="250" rx="8" fill="#efeee8"/>
  <rect x="1080" y="320" width="450" height="235" rx="8" fill="#efeee8"/>
  <rect x="550" y="585" width="520" height="225" rx="8" fill="#efeee8"/>
  <rect x="1050" y="580" width="480" height="235" rx="8" fill="#efeee8"/>
</g>

<!-- Top panel: revenue -->
<g>
  <text x="640" y="112" fill="#111315" font-size="25" font-weight="700" font-family="Arial">REVENUE PERFORMANCE</text>
  <text x="640" y="141" fill="#606469" font-size="13" font-family="Arial">Annual revenue • USD million</text>
  <line x1="650" y1="250" x2="960" y2="250" stroke="#9b9d9d" stroke-width="2"/>
  <rect x="700" y="196" width="72" height="54" fill="#35566b"/>
  <rect x="825" y="94" width="72" height="156" fill="#35566b"/>
  <text x="689" y="183" fill="#111315" font-size="14" font-weight="700" font-family="Arial">$182.08M</text>
  <text x="810" y="82" fill="#111315" font-size="14" font-weight="700" font-family="Arial">$717.82M</text>
  <text x="724" y="270" fill="#55595c" font-size="13" font-family="Arial">2020</text>
  <text x="849" y="270" fill="#55595c" font-size="13" font-family="Arial">2021</text>
  <text x="1010" y="135" fill="#5f6366" font-size="14" font-weight="700" font-family="Arial">TOTAL REVENUE</text>
  <text x="1008" y="180" fill="#111315" font-size="42" font-weight="800" font-family="Arial">$899.90M</text>
  <text x="1010" y="213" fill="#137b67" font-size="19" font-weight="800" font-family="Arial">+294.2% YoY</text>
  <text x="1012" y="239" fill="#686c6f" font-size="12" font-family="Arial">2021 vs 2020</text>
  <rect x="1345" y="92" width="60" height="28" fill="#d2d0c8"/>
  <rect x="620" y="62" width="115" height="23" fill="#d2d0c8"/>
</g>

<!-- Analysis panel -->
<g>
  <text x="605" y="340" fill="#111315" font-size="24" font-weight="700" font-family="Arial">OUR ANALYSIS</text>
  <text x="605" y="375" fill="#111315" font-size="22" font-weight="700" font-family="Arial">Revenue, profitability &amp;</text>
  <text x="605" y="404" fill="#111315" font-size="22" font-weight="700" font-family="Arial">commercial drivers</text>
  <g font-family="Arial" font-size="14" fill="#4a4e51">
