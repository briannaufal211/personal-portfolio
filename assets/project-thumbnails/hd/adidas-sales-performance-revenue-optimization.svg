    <circle cx="615" cy="475" r="6" fill="#35566b"/><text x="632" y="480">Regional performance</text>
    <circle cx="615" cy="505" r="6" fill="#35566b"/><text x="632" y="510">Retailer performance</text>
    <circle cx="615" cy="535" r="6" fill="#35566b"/><text x="632" y="540">Sales-method analysis</text>
  </g>
</g>

<!-- Regional panel -->
<g>
  <text x="1115" y="350" fill="#111315" font-size="23" font-weight="700" font-family="Arial">REGIONAL PERFORMANCE</text>
  <text x="1115" y="378" fill="#686d70" font-size="13" font-family="Arial">Revenue contribution</text>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#222629">
    <text x="1115" y="420">West</text><text x="1115" y="453">Northeast</text><text x="1115" y="486">Southeast</text><text x="1115" y="519">South</text><text x="1115" y="552">Midwest</text>
  </g>
  <g fill="#d0d1cf">
    <rect x="1200" y="406" width="225" height="15"/><rect x="1200" y="439" width="225" height="15"/><rect x="1200" y="472" width="225" height="15"/><rect x="1200" y="505" width="225" height="15"/><rect x="1200" y="538" width="225" height="15"/>
  </g>
  <g fill="#35566b">
    <rect x="1200" y="406" width="225" height="15"/><rect x="1200" y="439" width="155" height="15"/><rect x="1200" y="472" width="136" height="15"/><rect x="1200" y="505" width="121" height="15"/><rect x="1200" y="538" width="113" height="15"/>
  </g>
  <g fill="#34383b" font-family="Arial" font-size="12" font-weight="700">
    <text x="1440" y="418">30.0%</text><text x="1440" y="451">20.7%</text><text x="1440" y="484">18.1%</text><text x="1440" y="517">16.1%</text><text x="1440" y="550">15.1%</text>
  </g>
</g>

<!-- KPI panel -->
<g>
  <text x="585" y="620" fill="#111315" font-size="23" font-weight="700" font-family="Arial">KEY FINDINGS</text>
  <text x="585" y="675" fill="#111315" font-size="28" font-weight="800" font-family="Arial">36.91%</text>
  <text x="585" y="698" fill="#686c6f" font-size="11" font-family="Arial">Aggregate margin</text>
  <text x="810" y="675" fill="#111315" font-size="28" font-weight="800" font-family="Arial">23.2%</text>
  <text x="810" y="698" fill="#686c6f" font-size="11" font-family="Arial">Men's Street Footwear share</text>
  <text x="585" y="753" fill="#111315" font-size="28" font-weight="800" font-family="Arial">33.20%</text>
  <text x="585" y="776" fill="#686c6f" font-size="11" font-family="Arial">West regional margin</text>
  <text x="810" y="753" fill="#111315" font-size="28" font-weight="800" font-family="Arial">8</text>
  <text x="810" y="776" fill="#686c6f" font-size="11" font-family="Arial">Product-region combinations flagged</text>
</g>

<!-- Commercial drivers -->
<g>
  <text x="1085" y="620" fill="#111315" font-size="23" font-weight="700" font-family="Arial">COMMERCIAL DRIVERS</text>
  <text x="1085" y="655" fill="#6a6e71" font-size="12" font-family="Arial">Retailer</text>
  <text x="1240" y="655" fill="#111315" font-size="18" font-weight="700" font-family="Arial">West Gear</text>
  <text x="1085" y="681" fill="#6a6e71" font-size="11" font-family="Arial">Revenue</text>
  <text x="1240" y="681" fill="#111315" font-size="13" font-weight="700" font-family="Arial">$242.96M</text>
  <text x="1085" y="715" fill="#6a6e71" font-size="12" font-family="Arial">Sales method</text>
  <text x="1240" y="715" fill="#111315" font-size="18" font-weight="700" font-family="Arial">In-store</text>
  <text x="1085" y="741" fill="#6a6e71" font-size="11" font-family="Arial">Revenue</text>
  <text x="1240" y="741" fill="#111315" font-size="13" font-weight="700" font-family="Arial">$356.64M</text>
  <text x="1085" y="776" fill="#6a6e71" font-size="12" font-family="Arial">Online margin</text>
  <text x="1240" y="776" fill="#137b67" font-size="17" font-weight="800" font-family="Arial">38.99%</text>
</g>

<!-- Small footer note -->
<g>
  <rect x="1260" y="705" width="275" height="80" fill="#0d0f11" opacity=".88"/>
  <text x="1282" y="728" fill="#63c9b1" font-size="12" font-weight="700" font-family="Arial">FURTHER INVESTIGATION</text>
  <text x="1282" y="750" fill="#efeee8" font-size="11" font-family="Arial">8 product–region combinations</text>
  <text x="1282" y="767" fill="#9da2a5" font-size="10" font-family="Arial">State • retailer • sales-method mix</text>
</g>

<!-- rough tape -->
<rect x="1480" y="300" width="70" height="18" fill="#d2d0c8"/>
<rect x="520" y="540" width="95" height="18" fill="#d2d0c8"/>
<rect x="1000" y="560" width="85" height="18" fill="#d2d0c8"/>
